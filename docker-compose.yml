services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Neon pooled connection string}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      CORS_ORIGINS: "*"
